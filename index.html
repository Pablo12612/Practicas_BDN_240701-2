<style>

*{box-sizing:border-box}

body{

    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(186,230,253,0.9) 0%, rgba(186,230,253,0) 60%),
    radial-gradient(ellipse 50% 35% at 70% 80%, rgba(134,239,172,0.25) 0%, rgba(134,239,172,0) 60%),

}
body::before, body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(40px);opacity:.55}
body::before{width:520px;height:320px;left:-80px;top:10%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%)}
body::after{width:420px;height:260px;right:-60px;top:35%;background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.7), rgba(125,211,252,0) 70%)}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{

  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.55));
  border:1px solid var(--glass-border); border-bottom-color:rgba(255,255,255,.6);
  border-radius:18px; backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.95);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:#083344;letter-spacing:.2px}
.brand .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff, #7dd3fc 40%, #0284c7 85%);box-shadow:0 4px 10px rgba(2,132,199,.35), inset 0 1px 2px rgba(255,255,255,.9)}

.segmented{position:relative;display:flex;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:4px;box-shadow:inset 0 1px 2px rgba(255,255,255,.9), 0 4px 12px rgba(2,132,199,.12)}
.seg-btn{position:relative;z-index:1;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:#155e75;cursor:pointer;transition:color .2s}
.seg-btn.active{color:#083344}
.seg-indicator{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(224,247,255,.95) 45%, rgba(186,230,253,.9) 55%, rgba(125,211,252,.85) 100%);
  box-shadow:0 4px 10px rgba(2,132,199,.25), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(2,132,199,.15)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#0c4a6e;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9)}
.search-wrap{position:relative;min-width:260px;flex:1;max-width:520px}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.95);outline:none;color:var(--text);
  background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(240,249,255,.75)); box-shadow:inset 0 1px 0 #fff, 0 4px 10px rgba(2,132,199,.12); backdrop-filter:blur(8px)}
.search-wrap input:focus{box-shadow:inset 0 1px 0 #fff, 0 0 0 3px rgba(56,189,248,.35), 0 6px 14px rgba(2,132,199,.18)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7}
.view{flex:1;min-height:0;display:none}
.view.active{display:block}
#view-dict{overflow:auto;padding:6px 14px 18px}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin:4px 2px 12px}
.stat{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 #fff, 0 6px 14px rgba(2,132,199,.12)}
.stat b{display:block;font-size:18px;color:#0369a1}
.stat span{font-size:12px;color:#155e75;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));gap:14px;align-items:start}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.95); overflow:hidden}
.card-header{padding:12px 14px;cursor:pointer;background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(224,242,254,.45));border-bottom:1px solid rgba(255,255,255,.7);display:flex;gap:10px;align-items:flex-start}
.card-header:hover{background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(224,242,254,.6))}
.card-title{flex:1;min-width:0}
.card-title .tech{font-weight:800;color:#083344;font-size:15px;word-break:break-all}
.card-title .friendly{font-size:12.5px;color:#155e75;margin-top:2px;font-weight:600}
.card-meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.9);white-space:nowrap;
  background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.7) 45%, rgba(186,230,253,.55) 100%); box-shadow:inset 0 1px 0 #fff, 0 2px 6px rgba(2,132,199,.12)}
.badge.rows{color:#065f46;background:linear-gradient(180deg, #f0fff4 0%, #dcfce7 45%, #bbf7d0 100%);border-color:#d1fae5}
.badge.type{font-size:10px;padding:3px 7px}
.badge.t-text{color:#075985;background:linear-gradient(180deg,#fff,#e0f2fe 50%,#bae6fd)}
.badge.t-num{color:#5b21b6;background:linear-gradient(180deg,#fff,#ede9fe 50%,#ddd6fe)}
.badge.t-date{color:#9a3412;background:linear-gradient(180deg,#fff,#ffedd5 50%,#fed7aa)}
.badge.t-bool{color:#166534;background:linear-gradient(180deg,#fff,#dcfce7 50%,#bbf7d0)}
.badge.t-other{color:#334155;background:linear-gradient(180deg,#fff,#f1f5f9 50%,#e2e8f0)}
.badge.key-pk{color:#92400e;background:linear-gradient(180deg,#fffdf0,#fef3c7 50%,#fde68a)}
.badge.key-fk{color:#1e40af;background:linear-gradient(180deg,#f8fbff,#dbeafe 50%,#bfdbfe)}
.badge.req{color:#991b1b;background:linear-gradient(180deg,#fff,#fee2e2 50%,#fecaca)}
.badge.opt{color:#475569;background:linear-gradient(180deg,#fff,#f1f5f9 50%,#e2e8f0)}
.card-body{padding:10px 12px 12px;display:none}
.card.open .card-body{display:block}
.card-desc{font-size:13px;color:#334155;margin:2px 2px 10px;line-height:1.45}
.rel-list{margin:8px 0 10px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rel-list li{font-size:12.5px;color:#334155;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 9px}
.rel-list b{color:#0369a1}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.glossy-btn{border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:7px 12px;font-weight:700;color:#083344;cursor:pointer;
  background:linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(240,249,255,.95) 45%, rgba(186,230,253,.9) 55%, rgba(125,211,252,.85) 100%);

.glossy-btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #fff, 0 0 0 3px rgba(125,211,252,.25), 0 8px 16px rgba(2,132,199,.28);filter:saturate(1.1)}
.cols-wrap{overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.35)}
table.cols{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.cols th, table.cols td{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.6);vertical-align:top}
table.cols th{position:sticky;top:0;background:rgba(224,242,254,.85);backdrop-filter:blur(6px);color:#0c4a6e;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
table.cols tr:last-child td{border-bottom:0}
table.cols .cname{font-weight:700;color:#0f172a}
table.cols .ctype{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:#334155}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.muted{color:#64748b;font-size:12px}
.empty{padding:30px;text-align:center;color:#155e75;font-weight:600}
.objects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:2px 2px 14px}
.obj-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(14px);box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.95);overflow:hidden}
.obj-card .head{padding:10px 12px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(224,242,254,.45));border-bottom:1px solid rgba(255,255,255,.7);cursor:pointer}
.obj-card .head h3{margin:0;font-size:14px;color:#083344;flex:1}
.obj-card .count{font-weight:800;color:#0369a1;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:3px 8px;font-size:12px}
.obj-card .body{padding:8px 10px;max-height:240px;overflow:auto;display:none}
.obj-card.open .body{display:block}
.obj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.obj-list li{font-size:12.5px;color:#334155;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.obj-list .name{font-weight:700;color:#0f172a}
.obj-list .meta{font-size:11px;color:#155e75}

#view-eerd{position:relative;overflow:hidden}
.canvas-toolbar{position:absolute;top:10px;left:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.canvas-toolbar .panel, .canvas-topright .panel{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:8px;backdrop-filter:blur(12px);box-shadow:var(--glass-shadow), inset 0 1px 0 #fff}

#erd-viewport.panning{cursor:grabbing}
#erd-world{position:absolute;left:0;top:0;transform-origin:0 0}
#erd-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#erd-svg path{fill:none;stroke:rgba(2,132,199,.55);stroke-width:2;filter:drop-shadow(0 0 2px rgba(56,189,248,.45))}

.erd-node.dim{opacity:.35}

.erd-title .toggle{border:0;background:rgba(255,255,255,.6);border-radius:8px;width:22px;height:22px;cursor:pointer;font-weight:800;color:#0369a1}
.erd-fields{background:rgba(255,255,255,.55);max-height:340px;overflow:auto}
.erd-node.collapsed .erd-fields{display:none}
.erd-field{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:5px 8px;border-top:1px solid rgba(255,255,255,.7);font-size:11.5px}
.erd-field:hover{background:rgba(224,242,254,.6)}
.erd-field .icons{font-size:11px;min-width:34px}
.erd-field .fname{font-weight:700;color:#0f172a;word-break:break-all}
.erd-field .ftype{font-family:ui-monospace,Consolas,monospace;color:#475569;font-size:10.5px;justify-self:end}
.erd-field .fmeta{grid-column:2/4;color:#64748b;font-size:10.5px}
.legend{position:absolute;bottom:10px;left:10px;z-index:5;font-size:11.5px;color:#0c4a6e}
.legend .panel{padding:8px 10px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.search-wrap{min-width:160px}.canvas-topright input{width:180px}}
</style>
</head>

ra identificar el producto.'; if(ln.includes('image')||ln.includes('url')) return 'Dirección o enlace del recurso (imagen o página).'; if(ln.includes('rating')||ln.includes('calificacion')) return 'Calificación numérica otorgada.'; if(ln.includes('comment')||ln.includes('coment')||ln.includes('message')||ln.includes('mensaje')) return 'Comentario, mensaje u opinión en texto.'; if(ln.includes('label')||ln.includes('etiqueta')) return 'Etiqueta o nombre corto para reconocer este elemento.'; if(ln.includes('default')) return 'Indica si esta opción es la predeterminada.'; if(ln.includes('country')||ln.includes('pais')) return 'País o código de país relacionado.'; if(ln.includes('city')||ln.includes('municipio')) return 'Ciudad o municipio relacionado.'; if(ln.includes('address')||ln.includes('direccion')) return 'Información de dirección o ubicación.'; if(ln.includes('type')||ln.includes('tipo')) return 'Tipo o clasificación de este registro.'; if(ln.includes('code')||ln.includes('codigo')) return 'Código identificador o abreviado.'; if(ln.includes('gender')||ln.includes('genero')) return 'Género o identidad indicada por la persona.'; if(ln.includes('birth')) return 'Fecha de nacimiento.'; if(ln.includes('tracking')) return 'Número o código para rastrear el envío.'; if(ln.includes('carrier')||ln.includes('paqueter')) return 'Servicio o empresa encargada del traslado.'; if(col.fk) return 'Conecta este registro con '+col.fk.ref_table+' usando su identificador.'; if(isBoolLike(col)) return 'Valor de sí/no que indica una condición o estado.'; return 'Dato almacenado: '+humanizeName(n).toLowerCase()+'.'; }

];
  row.innerHTML = `<div class="objects-grid" style="width:100%">` + blocks.map(b=>`<div class="obj-card ${openObjCards.has(b.key)?'open':''}"><div class="head" onclick="toggleObjCard('${b.key}')"><span>${b.icon}</span><h3>${b.title}</h3><span class="count">${b.items.length}</span></div><div class="body"><ul class="obj-list">${b.items.length?b.items.map(i=>`<li>${b.render(i)}</li>`).join(''):`<li><span class="meta">No se encontraron.</span></li>`}</ul></div></div>`).join('') + `</div>`; }

function renderDict(){ const q=($('#globalSearch').value||'').trim().toLowerCase(); const grid=$('#dictGrid'); const filtered=SCHEMA.tables.filter(t=>{ if(!q) return true; if(t.name.toLowerCase().includes(q)) return true; if((t.friendlyTitle||'').toLowerCase().includes(q)) return true; if((t.friendlyDesc||'').toLowerCase().includes(q)) return true; return t.columns.some(c=>c.name.toLowerCase().includes(q)||(c.friendly||'').toLowerCase().includes(q)||(c.type||'').toLowerCase().includes(q)); }); $('#dictEmpty').style.display=filtered.length?'none':'block'; grid.innerHTML=filtered.map(t=>{ const open=openCards.has(t.name)||(q && t.columns.some(c=>c.name.toLowerCase().includes(q))); const relsOut=t.outgoing.map(fk=>`<li>${relSentence(t,fk)}</li>`).join(''); const relsIn=t.incoming.map(r=>`<li>La tabla <b>${esc(r.from)}</b> se relaciona con <b>${esc(t.name)}</b> mediante <b>${esc(r.fk.cols.join(', '))}</b> (referencia a ${esc(t.name)}.${esc(r.fk.ref_cols.join(', '))}).</li>`).join(''); const relsHtml=(relsOut||relsIn)?`<ul class="rel-list">${relsOut}${relsIn}</ul>`:`<div class="muted" style="margin:6px 0 10px">Sin relaciones de llave foránea registradas en el esquema.</div>`; const rows=t.columns.map(c=>{ const match=q&&(c.name.toLowerCase().includes(q)||(c.friendly||'').toLowerCase().includes(q)||(c.type||'').toLowerCase().includes(q)); return `<tr ${match?'style="background:rgba(254,240,138,.35)"':''}><td class="cname">${esc(c.name)} ${c.pk?'🔑':''} ${c.fk?'🔗':''}</td><td class="ctype">${esc(c.type)}</td><td>${esc(c.friendly)}</td><td>${columnBadges(c)}</td></tr>`; }).join(''); return `<article class="card ${open?'open':''}" data-table="${esc(t.name)}"><div class="card-header" onclick="toggleCard('${htmlAttr(t.name)}')"><div class="card-title"><div class="tech">${esc(t.name)}</div><div class="friendly">${esc(t.friendlyTitle)}</div></div><div class="card-meta"><span class="badge rows">📦 ${Number(t.row_count||0).toLocaleString('es-MX')} registros actuales</span><span class="badge type t-other">${t.columns.length} campos</span></div></div><div class="card-body"><div class="card-desc">${esc(t.friendlyDesc)}</div><div class="actions-row"><button class="glossy-btn" onclick="event.stopPropagation(); goToDiagram('${htmlAttr(t.name)}')">Ver en el diagrama</button></div><div style="font-weight:700;color:#0c4a6e;margin:6px 0 4px">Relaciones (en lenguaje natural)</div>${relsHtml}<div style="font-weight:700;color:#0c4a6e;margin:8px 0 4px">Columnas y significado</div><div class="cols-wrap"><table class="cols"><thead><tr><th>Columna</th><th>Tipo SQL</th><th>Significado funcional</th><th>Indicadores</th></tr></thead><tbody>${rows}</tbody></table></div></div></article>`; }).join(''); }
function toggleCard(name){ if(openCards.has(name)) openCards.delete(name); else openCards.add(name); renderDict(); }
function goToDiagram(name){ openCards.add(name); setView('eerd',{focusTable:name}); }
window.toggleCard=toggleCard; window.goToDiagram=goToDiagram;
$('#globalSearch').addEventListener('input',()=>renderDict());

// EERD
let erdRendered=false; let allEdges=null;
function renderERDIfNeeded(){ if(erdRendered) return; buildERD(); erdRendered=true; }
function cssId(s){ return s.replace(/[^a-zA-Z0-9_-]/g,'_'); }
function autoPositions(tables){ const groups={cat:[],core:[],prod:[],cart:[],order:[],pay:[],ship:[],addr:[],other:[],log:[]}; tables.forEach(t=>{ const n=t.name; if(n==='tb_logs') groups.log.push(t); else if(/categor|brand/.test(n)) groups.cat.push(t); else if(/(^tb_users$|^tb_people$)/.test(n)) groups.core.push(t); else if(/product|wishlist|review|image/.test(n)) groups.prod.push(t); else if(/cart/.test(n)) groups.cart.push(t); else if(/order_status|buyer_orders|order_items/.test(n)) groups.order.push(t); else if(/payment|transaction/.test(n)) groups.pay.push(t); else if(/ship|carrier|tracking/.test(n)) groups.ship.push(t); else if(/address/.test(n)) groups.addr.push(t); else groups.other.push(t); }); const layoutCols=[groups.core,groups.prod,groups.cat,groups.cart,groups.order,groups.pay,groups.ship,groups.addr,groups.other,groups.log]; const pos={}; let x=40; layoutCols.forEach(col=>{ if(!col.length) return; let y=30; col.forEach(t=>{ pos[t.name]={x,y}; y+= Math.min(320, 120 + t.columns.length*22); }); x+=360; }); let fy=30; tables.forEach(t=>{ if(!pos[t.name]){ pos[t.name]={x:x,y:fy}; fy+=260; } }); return pos; }
function buildERD(){ const nodesEl=$('#erd-nodes'); nodesEl.innerHTML=''; const tables=SCHEMA.tables.slice(); const pos=autoPositions(tables); erdState.nodes={}; tables.forEach(t=>{ const node=document.createElement('div'); node.className='erd-node'; node.id='node-'+cssId(t.name); node.dataset.table=t.name; node.style.left=pos[t.name].x+'px'; node.style.top=pos[t.name].y+'px'; const fields=t.columns.map(c=>{ const icons=`${c.pk?'🔑':''}${c.fk?'🔗':''}${!c.nullable?'⚠️':''}${c.unique&&!c.pk?'⭐':''}`||'•'; const extra=[c.pk?'PK':'',c.fk?`FK→${c.fk.ref_table}.${c.fk.ref_col}`:'',c.unique&&!c.pk?'UNIQUE':'',c.nullable?'NULL':'NOT NULL',c.default!=null?('DEFAULT '+c.default):'',c.extra||''].filter(Boolean).join(' · '); return `<div class="erd-field" data-col="${esc(c.name)}" data-fk="${c.fk?esc(c.fk.ref_table):''}"><div class="icons">${icons}</div><div class="fname">${esc(c.name)}<div class="fmeta">${esc(extra)}</div></div><div class="ftype">${esc(c.type)}</div></div>`; }).join(''); node.innerHTML=`<div class="erd-title"><span class="name">${esc(t.name)}</span><span class="cnt">${Number(t.row_count||0).toLocaleString('es-MX')} reg.</span><button class="toggle" title="Colapsar/Expandir">▾</button></div><div class="erd-fields">${fields}</div>`; nodesEl.appendChild(node); erdState.nodes[t.name]={el:node,x:pos[t.name].x,y:pos[t.name].y,collapsed:false}; const title=node.querySelector('.erd-title'); title.addEventListener('mousedown',(e)=>startDragNode(e,t.name)); node.querySelector('.toggle').addEventListener('click',(e)=>{ e.stopPropagation(); node.classList.toggle('collapsed'); erdState.nodes[t.name].collapsed=node.classList.contains('collapsed'); setTimeout(drawEdges,0); }); node.addEventListener('mouseenter',()=>{ erdState.hoverTable=t.name; highlightRelated(t.name,false); }); node.addEventListener('mouseleave',()=>{ erdState.hoverTable=null; if(!erdState.lockHighlight) highlightRelated(null,false); else applyHighlight(); }); node.querySelectorAll('.erd-field').forEach(f=>{ f.addEventListener('click',(e)=>{ const fk=f.dataset.fk; if(fk){ e.stopPropagation(); highlightRelated(t.name,true); } }); }); }); updateWorldTransform(); requestAnimationFrame(()=>{ sizeSvg(); drawEdges(); fitView(); }); }
function updateWorldTransform(){ $('#erd-world').style.transform=`translate(${erdState.tx}px, ${erdState.ty}px) scale(${erdState.scale})`; }
function worldBounds(){ let maxX=1200,maxY=900; Object.values(erdState.nodes).forEach(n=>{ const el=n.el; const rW=el.offsetWidth||280; const rH=el.offsetHeight||200; maxX=Math.max(maxX,n.x+rW+300); maxY=Math.max(maxY,n.y+rH+300); }); return {w:maxX,h:maxY}; }
function sizeSvg(){ const b=worldBounds(); const svg=$('#erd-svg'); svg.setAttribute('width',b.w); svg.setAttribute('height',b.h); svg.style.width=b.w+'px'; svg.style.height=b.h+'px'; }
function nodeRect(name){ const n=erdState.nodes[name]; if(!n) return null; const el=n.el; const w=el.offsetWidth||280; const h=el.offsetHeight||(n.collapsed?48:200); return {x:n.x,y:n.y,w,h,cx:n.x+w/2,cy:n.y+h/2}; }
function edgePath(a,b){ const ra=nodeRect(a), rb=nodeRect(b); if(!ra||!rb) return ''; let x1,y1,x2,y2; if(rb.cx>ra.x+ra.w+20){ x1=ra.x+ra.w; y1=ra.cy; x2=rb.x; y2=rb.cy; } else if(ra.cx>rb.x+rb.w+20){ x1=ra.x; y1=ra.cy; x2=rb.x+rb.w; y2=rb.cy; } else if(rb.cy>ra.cy){ x1=ra.cx; y1=ra.y+ra.h; x2=rb.cx; y2=rb.y; } else { x1=ra.cx; y1=ra.y; x2=rb.cx; y2=rb.y+rb.h; } const dx=Math.max(50, Math.abs(x2-x1)*0.45), dy=Math.max(30, Math.abs(y2-y1)*0.25); let c1x=x1,c1y=y1,c2x=x2,c2y=y2; if(Math.abs(x2-x1)>Math.abs(y2-y1)){ c1x=x1+(x2>=x1?dx:-dx); c2x=x2+(x2>=x1?-dx:dx); c1y=y1; c2y=y2; } else { c1x=x1; c2x=x2; c1y=y1+(y2>=y1?dy:-dy); c2y=y2+(y2>=y1?-dy:dy); } return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`; }
function collectEdges(){ const edges=[]; const seen=new Set(); SCHEMA.tables.forEach(t=>{ (t.fks||[]).forEach(fk=>{ if(!tableMap.has(fk.ref_table)) return; const key=t.name+'|'+fk.ref_table+'|'+fk.cols.join(',')+'|'+fk.ref_cols.join(','); if(seen.has(key)) return; seen.add(key); edges.push({from:t.name,to:fk.ref_table,cols:fk.cols,refCols:fk.ref_cols}); }); }); return edges; }
function drawEdges(){ if(!allEdges) allEdges=collectEdges(); sizeSvg(); const svg=$('#erd-svg'); let html=''; allEdges.forEach((e,i)=>{ const d=edgePath(e.from,e.to); if(!d) return; html+=`<path id="edge-${i}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}" marker-end="url(#crowfoot)" marker-start="url(#one)"></path>`; }); svg.innerHTML=`<defs><marker id="crowfoot" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0,7 L12,1 M0,7 L12,7 M0,7 L12,13" stroke="rgba(2,132,199,.8)" stroke-width="1.5" fill="none"/></marker><marker id="one" markerWidth="12" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M4,1 L4,13 M8,1 L8,13" stroke="rgba(2,132,199,.8)" stroke-width="1.5"/></marker></defs>`+html; applyHighlight(); }
function getRelatedSet(table){ if(!table) return null; const set=new Set([table]); allEdges.forEach(e=>{ if(e.from===table||e.to===table){ set.add(e.from); set.add(e.to); } }); return set; }
function highlightRelated(table,lock){ erdState.highlight=table; erdState.lockHighlight=!!(lock&&table); applyHighlight(); }
function applyHighlight(){ const h=erdState.highlight; const q=($('#erdSearch').value||'').trim().toLowerCase(); let searchSet=null; if(q){ searchSet=new Set(); SCHEMA.tables.forEach(t=>{ if(t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q))) searchSet.add(t.name); }); } const rel=h?getRelatedSet(h):null; const activeSet=rel||searchSet; Object.entries(erdState.nodes).forEach(([name,n])=>{ n.el.classList.toggle('hl', h===name || (searchSet&&searchSet.has(name)&&!rel)); n.el.classList.toggle('dim', activeSet?!activeSet.has(name):false); }); $all('#erd-svg path').forEach(p=>{ const f=p.dataset.from,to=p.dataset.to; const isRel=h?(f===h||to===h):(searchSet?(searchSet.has(f)||searchSet.has(to)):false); p.classList.toggle('hl',!!isRel); p.classList.toggle('dim',activeSet?!(activeSet.has(f)&&activeSet.has(to)):false); }); }
const viewport=$('#erd-viewport');
viewport.addEventListener('mousedown',(e)=>{ if(e.target.closest('.erd-node')) return; erdState.panning=true; viewport.classList.add('panning'); erdState.panStart={x:e.clientX,y:e.clientY,tx:erdState.tx,ty:erdState.ty}; erdState.lockHighlight=false; erdState.highlight=null; applyHighlight(); });
window.addEventListener('mousemove',(e)=>{ if(erdState.panning&&erdState.panStart){ erdState.tx=erdState.panStart.tx+(e.clientX-erdState.panStart.x); erdState.ty=erdState.panStart.ty+(e.clientY-erdState.panStart.y); updateWorldTransform(); } if(erdState.drag){ const d=erdState.drag; const dx=(e.clientX-d.sx)/erdState.scale; const dy=(e.clientY-d.sy)/erdState.scale; const n=erdState.nodes[d.table]; n.x=d.ox+dx; n.y=d.oy+dy; n.el.style.left=n.x+'px'; n.el.style.top=n.y+'px'; drawEdges(); } });
window.addEventListener('mouseup',()=>{ erdState.panning=false; viewport.classList.remove('panning'); erdState.panStart=null; erdState.drag=null; });
viewport.addEventListener('wheel',(e)=>{ e.preventDefault(); const rect=viewport.getBoundingClientRect(); const mx=e.clientX-rect.left,my=e.clientY-rect.top; const beforeX=(mx-erdState.tx)/erdState.scale,beforeY=(my-erdState.ty)/erdState.scale; const factor=e.deltaY<0?1.1:0.9; erdState.scale=Math.min(2.5,Math.max(0.15,erdState.scale*factor)); erdState.tx=mx-beforeX*erdState.scale; erdState.ty=my-beforeY*erdState.scale; updateWorldTransform(); },{passive:false});
function startDragNode(e,table){ e.stopPropagation(); const n=erdState.nodes[table]; erdState.drag={table,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y}; highlightRelated(table,true); }
function fitView(targetTable){ const vp=viewport.getBoundingClientRect(); if(targetTable && erdState.nodes[targetTable]){ const n=erdState.nodes[targetTable]; const el=n.el; const w=el.offsetWidth||280,h=el.offsetHeight||200; erdState.scale=Math.min(1.2,Math.max(0.35,Math.min(vp.width/(w+140),vp.height/(h+140)))); erdState.tx=vp.width/2-(n.x+w/2)*erdState.scale; erdState.ty=vp.height/2-(n.y+h/2)*erdState.scale; } else { let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity; Object.values(erdState.nodes).forEach(n=>{ const w=n.el.offsetWidth||280,h=n.el.offsetHeight||200; minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+w); maxY=Math.max(maxY,n.y+h); }); if(!isFinite(minX)) return; const bw=maxX-minX+140,bh=maxY-minY+140; erdState.scale=Math.min(1.1,Math.max(0.15,Math.min(vp.width/bw,vp.height/bh))); erdState.tx=(vp.width-bw*erdState.scale)/2-(minX-70)*erdState.scale; erdState.ty=(vp.height-bh*erdState.scale)/2-(minY-70)*erdState.scale; } updateWorldTransform(); }
function focusTable(table,glow){ if(!erdState.nodes[table]) return; fitView(table); if(glow){ highlightRelated(table,true); } }
$('#zoomIn').addEventListener('click',()=>{ erdState.scale=Math.min(2.5,erdState.scale*1.15); updateWorldTransform(); });
$('#zoomOut').addEventListener('click',()=>{ erdState.scale=Math.max(0.15,erdState.scale/1.15); updateWorldTransform(); });
$('#fitView').addEventListener('click',()=>fitView());
$('#autoLayout').addEventListener('click',()=>{ const pos=autoPositions(SCHEMA.tables); Object.entries(pos).forEach(([name,p])=>{ if(erdState.nodes[name]){ erdState.nodes[name].x=p.x; erdState.nodes[name].y=p.y; erdState.nodes[name].el.style.left=p.x+'px'; erdState.nodes[name].el.style.top=p.y+'px'; } }); drawEdges(); fitView(); });
$('#erdSearch').addEventListener('input',()=>{ erdState.lockHighlight=false; erdState.highlight=null; applyHighlight(); const q=$('#erdSearch').value.trim().toLowerCase(); if(q){ const t=SCHEMA.tables.find(t=>t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q))); if(t) focusTable(t.name,false); } });

renderStats(); renderDict();
</script>
